<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1. HTML5 Validation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="task0.html">Task 0</a>

    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>
  </nav>

  <main>
    <h1>Contact Form with Validation</h1>
    <form action="#" method="post">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required minlength="2" maxlength="50">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required minlength="10" maxlength="500"></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>

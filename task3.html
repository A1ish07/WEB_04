<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3. Bootstrap Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand bg-light">
    <div class="container">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
        <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
        <li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <h1>Contact Form Validation</h1>
    <form action="#" method="post">
      <div class="row">
        <div class="col-12 mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control is-valid" id="name" name="name" placeholder="Name" value="Alex" required minlength="2">
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Name is required.</div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control is-invalid" id="email" name="email" placeholder="Email" value="alex.com" required>
          <div class="form-text">We will never share your email.</div>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Email is required.</div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control is-invalid" id="message" name="message" rows="5" placeholder="Message" required minlength="10"></textarea>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Message is required.</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </main>
</body>
</html>
